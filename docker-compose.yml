version: "3.9"

services:
  relayer:
    build: .
    container_name: meta-relayer
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      RPC_URL: ${RPC_URL}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
      FORWARDER_ADDRESS: ${FORWARDER_ADDRESS}
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: meta-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["node", "server.js"]
    ports:
      - "8080:8080"
    depends_on:
      - relayer
    environment:
      FRONTEND_PORT: 8080
    restart: unless-stopped
